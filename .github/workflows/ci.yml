# G25 评审 M10：最小 CI。
#
# 棘轮（CONNECT_CEILING）、描述契约（DESC_CAP / PARAM_CAP）、路由句契约与
# 哈希锁（tool_defs_lock.json）都只在这台服务器上跑过——没有强制执行点的守卫
# 守的只是写它的人的自觉。这条 workflow 把 pytest 变成 push/PR 的必经门；
# 零 token 成本，~40 行。
#
# runner 只放 windows：仓里两处 Windows 专属事实（DPAPI 凭据落盘的默认策略、
# NTFS ACL 的措辞）是功能而不是巧合，Ubuntu 上跑不是"更严格的检验"而是
# "另一个没有定义过的平台"。

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # 全档依赖进主依赖（17.0 W7）：一条 pip 装齐浏览器/PDF/OCR/重排的
        # Python 侧。浏览器二进制本身不在这里装——suite 对它的缺席是跳过
        # 不是失败，CI 一样。
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q
