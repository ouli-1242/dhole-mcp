<!DOCTYPE html>
<!--
  line_chart.html —— tests/line_chart.pdf 的**作者**（P4 的正面对照，专门管"过滤过头"）。

  细线过滤有一个反面：一本正经的折线图**几乎全部由细线组成** —— 坐标轴是 1pt 的线、
  网格线是 1pt 的线，数据那条折线也只有 2pt 粗，但它横跨 285×90pt 的范围。如果判据取
  "笔画粗细"，这一页会被判成"只有装饰线"，图就又无声消失了 —— 那正是 P4 要修的那件事。
  所以这里钉住的是：判据看的是**这条 mark 围不围出一块面积**（bbox 短边），不是它多粗。

      "C:/Program Files/Google/Chrome/Application/chrome.exe" \
        --headless=new --disable-gpu --no-pdf-header-footer \
        --print-to-pdf="D:/tools/dhole-mcp/tests/line_chart.pdf" \
        "file:///D:/tools/dhole-mcp/tests/line_chart.html"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Line chart fixture</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; font-size: 11pt; color: #000;
         margin: 36pt; }
  h2 { font-size: 14pt; margin: 0 0 8pt 0; }
  .caption { font-size: 10pt; margin-top: 6pt; }
</style>
</head>
<body>
<h2>Monthly revenue, drawn with strokes thinner than 3pt</h2>

<svg width="420" height="180" viewBox="0 0 420 180" role="img"
     aria-label="line chart of monthly revenue">
  <!-- 轴与网格：短边 0，属于"线"而不是"图"。 -->
  <line x1="30" y1="10" x2="30" y2="160" stroke="#888" stroke-width="1"/>
  <line x1="30" y1="160" x2="410" y2="160" stroke="#888" stroke-width="1"/>
  <line x1="30" y1="60" x2="410" y2="60" stroke="#ddd" stroke-width="1"/>
  <line x1="30" y1="110" x2="410" y2="110" stroke="#ddd" stroke-width="1"/>
  <!-- 数据：同样只有 2pt 粗，但它围出 285x90 的范围 —— 这一条才是内容。 -->
  <polyline points="30,140 110,90 190,110 270,40 350,70 410,20" fill="none"
            stroke="#c00" stroke-width="2"/>
  <rect x="60" y="20" width="4" height="4" fill="#00c"/>
</svg>

<p class="caption">Figure 2: the trend is the only unread thing here
(4421-line-chart-anchor).</p>
</body>
</html>
