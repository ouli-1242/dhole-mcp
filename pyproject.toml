[project]
name = "dhole-mcp"
# 版本单一来源：src/dhole_mcp/__init__.py 的 __version__。
# 历史上这里有硬编码的哨兵值 99.0.0，与 CLI 报的版本 / PyPI 上的版本三处不一致。
dynamic = ["version"]
description = "让 AI 代理访问互联网：抓取 · 爬取 · 搜索，内置反爬，$0 无密钥。Web research for AI agents: fetch, crawl & keyless search with anti-bot bypass."
readme = "README.md"
authors = [{name = "ouli-1242", email = "ouli1242@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    # W7 (D2 approved): the previous `[all]` extras are folded in here, so
    # `pip install dhole-mcp` gets you the FULL tier - browser / PDF / OCR /
    # reranker / docx / xlsx. The obvious command is now also the correct one.
    #
    # Cost: hundreds of MB per install (onnxruntime + opencv-headless +
    # patchright + playwright + rapidocr dominate). Trade-off accepted:
    # "heavy but works" beats "lean and silently degraded" - the pre-W7 shape
    # meant the plain install was HTTP-only and every capability gap only
    # surfaced as a runtime failure. See §3 W6 for the mirror change on the
    # hint side; the two together are what "zero-config works" actually
    # needs.
    #
    # NOTE: `playwright install chromium` is STILL a separate step (a browser
    # binary download). W7 does not change that - the Python packages land
    # via pip, but the ~150MB Chromium engine that patchright/playwright
    # drive has to be fetched once per host. W8 (`dhole init`) is what folds
    # the two together; W7 alone is not "install and go".
    #
    # Core HTTP / search / extract (unchanged from the pre-W7 default):
    "mcp>=2.0,<3",
    "pydantic>=2.0",
    "trafilatura>=2.0.0",
    "aiosqlite>=0.20.0",
    # metasearch backends (vendored ddgs engine layer, MIT) - keyless search:
    "primp>=1.0",
    "httpx[http2,socks]>=0.27",
    "fake-useragent>=2.0",
    "lxml>=5.0",
    "cssselect>=1.2",
    # Content extraction (HTML->markdown fallback):
    "markdownify>=1.2.0",
    # Directly imported by search_engines.fetch_source_for_similar for title
    # extraction. It used to resolve only transitively (or not at all — the
    # import is inside a try/except, so a missing bs4 silently degraded that
    # path to an empty result). Declared explicitly now.
    "beautifulsoup4>=4.12",
    # Directly imported at module level by search_metasearch.py. h2 arrives
    # via the httpx[http2] extra and httpcore is httpx's own core dep, but
    # importing them directly without declaring them is a latent break.
    "h2>=4.0",
    "httpcore>=1.0,<2.0",
    # ─── the pre-W7 `[all]` tier, now default ────────────────────────────
    # Browser deps (patchright for anti-detect browser, playwright for JS
    # rendering, browserforge for fingerprint generation). These may not
    # install on all platforms (e.g. playwright has no aarch64/Termux wheels)
    # - on such hosts `pip install dhole-mcp` will fail at this block, and
    # the user must fall back to `pip install dhole-mcp[slim]` (see below).
    "patchright>=1.50",
    "playwright>=1.50",
    "browserforge>=1.2.4",
    # PDF + OCR deps:
    "requests>=2.31",
    "pdfplumber>=0.11.0",
    "pypdfium2>=4.30",
    "rapidocr>=3.0",
    "onnxruntime>=1.16",
    "tokenizers>=0.20",
    # QR 解码（screenshot 的 decode_qr）：确定性本地解码，不是视觉任务。
    # headless 变体不拖 GUI 依赖；懒加载在 qr.py，缺失时报错并给出本命令。
    "opencv-python-headless>=4.8",
    # Local file parsing (parse tool):
    "python-docx>=1.0",
    "openpyxl>=3.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Framework :: AsyncIO",
]
keywords = ["mcp", "web-scraping", "cloudflare-bypass", "anti-bot", "content-extraction", "ai-agent", "mcp-server"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    # 仅测试用：tests/test_pdf_real.py 现场生成加密 PDF 样本（不往仓库里塞二进制件）。
    # 运行时不需要它 —— PDF 提取走 pdfplumber（已并入 default deps）。
    "pypdf>=5.0",
]
all = [
    # W7 keeps the `all` extra alive with its pre-W7 contents. Deleting it
    # breaks two hard dependencies:
    #   1. updater.py's self-heal path (`_pip("--force-reinstall",
    #      "--no-deps", "dhole-mcp[all]==" + TARGET)` at 550/556) - the
    #      repair script literally installs the extra by name;
    #   2. the 49+ hint strings across docs and code that already say
    #      `pip install dhole-mcp[all]` (see plan §3 W6.2). Those remain
    #      valid because installing the `[all]` extra on a full-default
    #      wheel is idempotent - the deps are already there, pip does
    #      not complain, and the docs do not need a coordinated edit.
    # Contents below mirror the block added to [project].dependencies.
    "patchright>=1.50",
    "playwright>=1.50",
    "browserforge>=1.2.4",
    "requests>=2.31",
    "pdfplumber>=0.11.0",
    "pypdfium2>=4.30",
    "rapidocr>=3.0",
    "onnxruntime>=1.16",
    "tokenizers>=0.20",
    "opencv-python-headless>=4.8",
    "python-docx>=1.0",
    "openpyxl>=3.1",
]
slim = [
    # W7 introduces `slim` as a NAME for the pre-W7 default set (HTTP +
    # search only, no browser / PDF / OCR / reranker). Two things to know
    # before you reach for it:
    #
    #   1. pip extras can only ADD to `dependencies`, never subtract. Since
    #      W7 folded the heavy tier INTO `dependencies`, `pip install
    #      dhole-mcp[slim]` resolves to the same set as plain
    #      `pip install dhole-mcp` - it is not "back to HTTP-only" the way
    #      plan §3 W7 test #2 hoped. To actually get a slim install today
    #      you need `pip install --no-deps dhole-mcp` and hand-pick the
    #      runtime core; a future release that adds a real slim wheel would
    #      change that.
    #   2. Playwright / patchright have no aarch64 or Termux wheels. On
    #      those hosts `pip install dhole-mcp` fails at the *browser
    #      block*; the `[slim]` name is what you point at in a build
    #      script, even if pip currently resolves it the same.
    #
    # Kept empty so the name exists in `pip index` metadata and in error
    # messages ("try `pip install dhole-mcp[slim]`") without pretending
    # to do something pip cannot do.
]

[project.urls]
Repository = "https://github.com/ouli-1242/dhole-mcp"
Issues = "https://github.com/ouli-1242/dhole-mcp/issues"

[project.scripts]
dhole = "dhole_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# 唯一的版本定义处：CLI 的 dhole -v、pip show、PyPI 元数据都读它
path = "src/dhole_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dhole_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always import dhole_mcp from src/, never from a built wheel installed in
# .venv. The dev venv ships a BUILT wheel (not editable); without this, pytest
# silently runs the stale installed copy and src/ edits go untested. This has
# bitten the project 4+ times. pythonpath (pytest 7+) wins over install.
pythonpath = ["src"]
addopts = ["-m", "not e2e and not live"]
markers = [
    "e2e: end-to-end tests that spawn a real dhole.exe subprocess. Skip by default in CI; run manually with `pytest -m e2e`.",
    "real_state_paths: opt out of the autouse state-file isolation; the test asserts where paths.py resolves state files, so redirecting them would make it verify nothing.",
    "live: tests that hit the real network (search engines, real robots.txt). Never in the default run; opt in with `-m live`. Engine tests additionally pass --engine-fixtures to capture/diff SERP fixtures.",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# 起步用 ruff 的默认规则集（pycodestyle 错误 E4/E7/E9 + pyflakes F），
# 保证基线可通过；后续可按需收紧（I / UP / B / SIM 等）。
select = ["E4", "E7", "E9", "F"]
ignore = [
    # 有意的延迟导入：patchright / playwright / rapidocr / numpy 等重依赖
    # 只在使用点 import，以保住冷启动速度和 HTTP-only 降级模式。
    "E402",
]
